<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ZeroScript</title>
  <style>
    /* ─── Base ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: linear-gradient(165deg, #10151e 0%, #0a0d12 100%);
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #dce6f0;
      overflow: hidden;
    }

    /* ─── Amber brand stripe ─────────────────────────────────── */
    .topbar {
      height: 2px;
      background: linear-gradient(90deg, #ffb224 0%, rgba(255,178,36,0.45) 50%, transparent 100%);
    }

    /* ─── Header ─────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 13px 15px 12px;
      background: linear-gradient(90deg, rgba(255,178,36,0.09), transparent 65%);
      border-bottom: 1px solid rgba(148,163,184,0.10);
    }

    .logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.15px;
      color: #f2f5f9;
    }

    /* version badge — JS sets textContent on #ver */
    #ver {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #ffb224;
      background: rgba(255,178,36,0.10);
      border: 1px solid rgba(255,178,36,0.28);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: ui-monospace, "Cascadia Mono", monospace;
    }

    .header-tag {
      margin-left: auto;
      font-size: 9px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #334050;
      font-family: ui-monospace, "Cascadia Mono", monospace;
    }

    /* ─── Status card ─────────────────────────────────────────── */
    .status-card {
      margin: 11px 13px;
      padding: 11px 12px;
      background: rgba(148,163,184,0.04);
      border: 1px solid rgba(148,163,184,0.12);
      border-left: 2px solid #3a4757;
      border-radius: 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: border-left-color 0.4s ease;
    }

    /* Dynamic spine colour — Chrome 105+ :has() */
    .status-card:has(.dot.on)   { border-left-color: rgba(46, 184,114, 0.55); }
    .status-card:has(.dot.warn) { border-left-color: rgba(240,180, 41, 0.55); }

    .dot-col { padding-top: 3px; flex: none; }

    /* JS sets: dot.className = "dot" + (" on" | " warn" | "") */
    .dot {
      display: block;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #384757;
      transition: background 0.4s ease;
    }
    .dot.on   { background: #2eb872; animation: gp 1.8s ease-out infinite; }
    .dot.warn { background: #f0b429; animation: ap 1.8s ease-out infinite; }

    @keyframes gp {
      0%   { box-shadow: 0 0 0 0   rgba(46,184,114,.55); }
      100% { box-shadow: 0 0 0 7px rgba(46,184,114,  0); }
    }
    @keyframes ap {
      0%   { box-shadow: 0 0 0 0   rgba(240,180,41,.55); }
      100% { box-shadow: 0 0 0 7px rgba(240,180,41,  0); }
    }

    .status-body { flex: 1; min-width: 0; }

    #state {
      font-size: 12px;
      font-weight: 600;
      color: #c0ccd8;
      line-height: 1.35;
    }

    #tools {
      margin-top: 4px;
      font-size: 10px;
      color: #4a5a6a;
      font-family: ui-monospace, "Cascadia Mono", monospace;
      letter-spacing: 0.15px;
    }

    #servers {
      margin-top: 6px;
      font-size: 10px;
      color: #394857;
      white-space: pre-line;
      font-family: ui-monospace, "Cascadia Mono", monospace;
      line-height: 1.7;
    }

    #tools:empty, #servers:empty { display: none; }

    /* ─── Supported sites collapsible ───────────────────────── */
    .sites-wrap { margin: 0 13px 3px; }

    .sites > summary {
      list-style: none;
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 7px 2px;
      border-top: 1px solid rgba(148,163,184,0.08);
      font-size: 9.5px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #3a4858;
      font-family: ui-monospace, "Cascadia Mono", monospace;
      transition: color 0.14s ease;
    }
    .sites > summary::-webkit-details-marker { display: none; }
    .sites > summary:hover { color: #5a6a7a; }
    .sites > summary::after {
      content: '›';
      margin-left: auto;
      font-size: 13px;
      line-height: 1;
      opacity: 0.4;
      transition: transform 0.18s ease;
    }
    .sites[open] > summary::after { transform: rotate(90deg); }

    #sites {
      max-height: 112px;
      overflow-y: auto;
      padding: 4px 0 7px;
      scrollbar-width: thin;
      scrollbar-color: rgba(148,163,184,0.15) transparent;
    }
    #sites::-webkit-scrollbar { width: 4px; }
    #sites::-webkit-scrollbar-thumb {
      background: rgba(148,163,184,0.15);
      border-radius: 4px;
    }
    #sites div {
      font-size: 10.5px;
      padding: 2px 5px;
      color: #3a4a5a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-radius: 4px;
      transition: background 0.12s ease, color 0.12s ease;
    }
    #sites div:hover { background: rgba(148,163,184,0.07); color: #7a8a9a; }

    /* ─── Buttons ─────────────────────────────────────────────── */
    .btns {
      padding: 6px 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-pair { display: flex; gap: 6px; }

    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 8.5px 12px;
      line-height: 1;
      transition: background 0.14s ease, filter 0.14s ease, transform 0.09s ease;
    }
    button:active { transform: scale(0.97); }

    /* Paired small buttons */
    #reconnect, #restart {
      flex: 1;
      background: rgba(148,163,184,0.07);
      color: #8a9aaa;
      border: 1px solid rgba(148,163,184,0.13);
    }
    #reconnect:hover, #restart:hover {
      background: rgba(148,163,184,0.13);
      color: #c0ccd8;
    }

    /* Full-width ghost */
    #settings {
      width: 100%;
      background: rgba(148,163,184,0.07);
      color: #8a9aaa;
      border: 1px solid rgba(148,163,184,0.13);
    }
    #settings:hover {
      background: rgba(148,163,184,0.13);
      color: #c0ccd8;
    }

    /* Trakteer CTA — the one amber moment in the button group */
    #trakteer {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #ffb224 100%);
      color: #1c1204;
      font-weight: 700;
      box-shadow: 0 2px 16px rgba(255,178,36,0.22);
    }
    #trakteer:hover {
      filter: brightness(1.07);
      box-shadow: 0 4px 20px rgba(255,178,36,0.32);
    }

    /* ─── Setup hint ──────────────────────────────────────────── */
    .hint {
      margin: 6px 13px 13px;
      padding: 8px 11px;
      background: rgba(148,163,184,0.025);
      border: 1px solid rgba(148,163,184,0.08);
      border-radius: 7px;
      font-size: 10.5px;
      color: #364452;
      line-height: 1.6;
    }
    .hint code {
      background: rgba(148,163,184,0.11);
      padding: 0 4px;
      border-radius: 4px;
      color: #5a6a7a;
      font-family: ui-monospace, "Cascadia Mono", monospace;
      font-size: 10px;
    }
    .hint b { color: #4a5a6a; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Amber brand stripe -->
  <div class="topbar"></div>

  <!-- Header: logo · version · product tag -->
  <header class="header">
    <span class="logo">ZeroScript</span>
    <span id="ver"></span>
    <span class="header-tag">Roblox Agent</span>
  </header>

  <!-- Live status card -->
  <div class="status-card">
    <div class="dot-col"><span id="dot" class="dot"></span></div>
    <div class="status-body">
      <div id="state">Bridge: …</div>
      <div id="tools"></div>
      <div id="servers"></div>
    </div>
  </div>

  <!-- Supported AI sites (collapsible) -->
  <div class="sites-wrap">
    <details class="sites">
      <summary id="sites-summary">Supported sites</summary>
      <div id="sites"></div>
    </details>
  </div>

  <!-- Actions -->
  <div class="btns">
    <div class="btn-pair">
      <button id="reconnect">↻ Reconnect</button>
      <button id="restart">⟳ Restart server</button>
    </div>
    <button id="settings">⚙ Open Settings</button>
    <button id="trakteer">♥ Support on Treakteer</button>
  </div>

  <!-- Quick-start hint -->
  <div class="hint">
    Run <code>start.bat</code> → open <b>Roblox Studio</b> → navigate to a supported AI site.
  </div>

  <script src="popup.js"></script>
</body>
</html>
