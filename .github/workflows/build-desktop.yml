# Builds the ZeroScript DESKTOP packages (no Python/Node needed by end users)
# on all three platforms and attaches them to a GitHub Release.
#
# Triggered automatically when a release is published (created by the manual
# "Create Release" workflow) or manually from the Actions tab.
name: Build Desktop Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: zeroscript-windows
          - os: macos-latest
            artifact: zeroscript-macos
          - os: ubuntu-latest
            artifact: zeroscript-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements.txt

      - name: Install NSIS (Windows installer only)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libglib2.0-0

      - name: Build the package
        shell: bash
        run: python packaging/build.py --version "${{ github.event.release.tag_name || '' }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/packages/*
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/packages/*
